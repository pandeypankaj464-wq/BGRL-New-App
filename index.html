    const client = google.accounts.oauth2.initTokenClient({
      client_id: cid,
      scope: 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.email',
      callback: (resp)=>{
        if(resp.error){ alert('Sign-in error: '+resp.error); return; }
        gToken = resp.access_token;
        fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+gToken}})
          .then(r=>r.json()).then(u=>{ gUser = u.email || u.name || 'signed-in'; go('cloud'); })
          .catch(()=>{ gUser='signed-in'; go('cloud'); });
      }
    });
    client.requestAccessToken({prompt:''});
  }catch(e){ alert('Could not start Google Sign-In: '+e.message); }
}
function gSignOut(){
  if(gToken && window.google){
    try{ google.accounts.oauth2.revoke(gToken, ()=>{}); }catch(e){}
  }
  gToken=null; gUser=null; gDriveFileId=null;
  go('cloud');
}
async function gApi(path, opts={}){
  if(!gToken) throw new Error('Not signed in');
  const r = await fetch('https://www.googleapis.com'+path, {
    ...opts,
    headers: { Authorization: 'Bearer '+gToken, ...(opts.headers||{}) }
  });
  if(!r.ok){ const t=await r.text(); throw new Error(r.status+' '+t.slice(0,200)); }
  if(r.status===204) return null;
  const ct = r.headers.get('content-type')||'';
  return ct.includes('json') ? r.json() : r.blob();
}
async function findDriveFile(){
  // list in appDataFolder
  const q = encodeURIComponent("name = 'BGR-TMS-backup.json' and trashed = false");
  const res = await gApi('/drive/v3/files?spaces=appDataFolder&q='+q+'&fields=files(id,name,modifiedTime)');
  if(res.files && res.files.length) return res.files[0];
  return null;
}
async function gUpload(){
  if(!gToken) return alert('Sign in first');
  try{
    const payload = JSON.stringify({app:'BGR-TMS',version:1,date:new Date().toISOString(),data:DB}, null, 1);
    const blob = new Blob([payload], {type:'application/json'});
    let file = await findDriveFile();
    if(file){
      // update
      const meta = { name: 'BGR-TMS-backup.json' };
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(meta)], {type:'application/json'}));
      form.append('file', blob);
      const r = await fetch('https://www.googleapis.com/upload/drive/v3/files/'+file.id+'?uploadType=multipart', {
        method: 'PATCH',
        headers: { Authorization: 'Bearer '+gToken },
        body: form
      });
      if(!r.ok) throw new Error(await r.text());
      localStorage.bgrLastBk = today();
      alert('Updated backup on Google Drive successfully.');
    } else {
      // create in appDataFolder
      const meta = { name: 'BGR-TMS-backup.json', parents: ['appDataFolder'] };
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(meta)], {type:'application/json'}));
      form.append('file', blob);
      const r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        headers: { Authorization: 'Bearer '+gToken },
        body: form
      });
      if(!r.ok) throw new Error(await r.text());
      localStorage.bgrLastBk = today();
      alert('Uploaded new backup to Google Drive (appDataFolder).');
    }
  }catch(e){ alert('Upload failed: '+e.message); }
}
async function gDownload(){
  if(!gToken) return alert('Sign in first');
  try{
    const file = await findDriveFile();
    if(!file) return alert('No BGR-TMS-backup.json found in Drive appDataFolder.');
    if(!confirm('Found backup modified '+ (file.modifiedTime||'') +'. This will REPLACE all current data after downloading a local backup first. Continue?')) return;
    bk(); // local safety backup
    const blob = await gApi('/drive/v3/files/'+file.id+'?alt=media');
    const text = await blob.text();
    let d;
    try{ d = JSON.parse(text).data; ST.forEach(s=>{ if(d && !d[s]) d[s]=[]; }); if(JSON.parse(text).app!='BGR-TMS' || !ST.every(s=>Array.isArray(d[s]))) throw 0; }catch(e){ return alert('Invalid backup from Drive.'); }
    replaceAll(d);
    alert('Restored from Google Drive successfully.');
    go('dash');
  }catch(e){ alert('Download failed: '+e.message); }
}
